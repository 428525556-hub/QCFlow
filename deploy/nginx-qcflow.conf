# QCFlow 国内正式域名 HTTPS 配置（syqcflow.cn）
# 使用方式：备案通过后
#   sudo mkdir -p /etc/nginx/ssl
#   将证书放入 /etc/nginx/ssl/syqcflow.cn.pem 与 syqcflow.cn.key
#   sudo cp deploy/nginx-qcflow.conf /etc/nginx/conf.d/qcflow.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name syqcflow.cn www.syqcflow.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name syqcflow.cn www.syqcflow.cn;

    ssl_certificate     /etc/nginx/ssl/syqcflow.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/syqcflow.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
