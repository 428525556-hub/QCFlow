services:
  qcflow:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_AUTH_BACKEND: ${NEXT_PUBLIC_AUTH_BACKEND:-supabase}
        NEXT_PUBLIC_STORAGE_BACKEND: ${NEXT_PUBLIC_STORAGE_BACKEND:-supabase}
        NEXT_PUBLIC_COS_INSPECTION_PHOTOS_BASE_URL: ${NEXT_PUBLIC_COS_INSPECTION_PHOTOS_BASE_URL:-}
        NEXT_PUBLIC_COS_ORDER_ATTACHMENTS_BASE_URL: ${NEXT_PUBLIC_COS_ORDER_ATTACHMENTS_BASE_URL:-}
    image: qcflow:latest
    container_name: qcflow
    restart: unless-stopped
    ports:
      - "8443:3000"
    environment:
      AUTH_BACKEND: ${AUTH_BACKEND:-supabase}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      DATA_BACKEND: ${DATA_BACKEND:-supabase}
      DATABASE_URL: ${DATABASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-supabase}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET_INSPECTION_PHOTOS: ${COS_BUCKET_INSPECTION_PHOTOS:-}
      COS_BUCKET_ORDER_ATTACHMENTS: ${COS_BUCKET_ORDER_ATTACHMENTS:-}
      COS_INSPECTION_PHOTOS_BASE_URL: ${COS_INSPECTION_PHOTOS_BASE_URL:-}
      COS_ORDER_ATTACHMENTS_BASE_URL: ${COS_ORDER_ATTACHMENTS_BASE_URL:-}
    depends_on:
      - qcflow-pg

  qcflow-pg:
    image: postgres:16-alpine
    container_name: qcflow-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: qcflow
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: qcflow
    volumes:
      - qcflow_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  qcflow_pgdata:
